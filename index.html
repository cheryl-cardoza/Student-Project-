<!DOCTYPE html>
<html>
<head>
    <title>Student Score Predictor</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            text-align: center;
            color: white;
        }

        .container {
            background: white;
            color: black;
            padding: 30px;
            width: 350px;
            margin: 100px auto;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px;
            width: 95%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎓 Student Score Predictor</h1>

        <form action="/predict" method="post">
            <input type="number" name="reading" placeholder="Reading Score" required>
            <input type="number" name="writing" placeholder="Writing Score" required>
            <button type="submit">Predict Score</button>
        </form>

        <!-- SHOW ONLY AFTER CLICK -->
        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>

</body>
</html>
